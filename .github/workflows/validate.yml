name: Validate ESP32-S3 wireless panel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arduino-check:
    name: ESP32-S3 Arduino compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        shell: bash
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib update-index
          arduino-cli lib install 'NimBLE-Arduino@2.5.1'
          arduino-cli lib install 'ESP32-BLE-Gamepad@0.8.0'
      - name: Compile ESP32 sketch
        shell: bash
        run: |
          sketch=$(find . -type f -name 'ETS2_WirelessPanel.ino' -print -quit)
          if [[ -z "$sketch" ]]; then
            echo 'ETS2_WirelessPanel.ino not found; refusing to report a skipped build as success.'
            exit 1
          fi
          mkdir -p /tmp/ETS2_WirelessPanel
          cp "$sketch" /tmp/ETS2_WirelessPanel/ETS2_WirelessPanel.ino
          arduino-cli compile --fqbn esp32:esp32:esp32s3 /tmp/ETS2_WirelessPanel
